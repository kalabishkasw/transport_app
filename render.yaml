# опис інфраструктури для Render.com
# дозволяє створити веб-сервіс + базу одним кліком через "New Blueprint"
databases:
  - name: transport-db
    plan: free
    databaseName: transport_db
    user: transport_user

services:
  - type: web
    name: transauto-travel
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 3 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transport-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.10"
