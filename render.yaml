# опис інфраструктури для Render.com

databases:
  - name: transport-db
    plan: free
    region: frankfurt
    databaseName: transport_db
    user: transport_user

services:
  - type: web
    name: transauto-travel
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && gunicorn config.wsgi:application --workers 3 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transport-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.10"
